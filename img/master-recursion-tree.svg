<svg xmlns="http://www.w3.org/2000/svg" width="716" height="422" viewBox="0 0 716 422" role="img" aria-labelledby="title description">
  <title id="title">主定理递归树的逐层成本</title>
  <desc id="description">每个内部节点有 a 个孩子。第 i 层有 a 的 i 次方个节点，单个节点的本地成本为 f(n 除以 b 的 i 次方)。右栏依次列出根、深度 1、深度 2 和叶子层的总成本。</desc>
  <style>
    text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #1c3448; }
    .heading { font-size: 23px; font-weight: 700; }
    .column { font-size: 17px; font-weight: 700; fill: #3d5b70; }
    .depth { font-size: 16px; fill: #46677c; text-anchor: middle; }
    .math { font-family: "Cambria Math", "Times New Roman", serif; font-size: 22px; }
    .center { text-anchor: middle; }
    .edge { fill: none; stroke: #7899ac; stroke-width: 2; stroke-linecap: round; }
    .node { fill: #e7f3f5; stroke: #6395a0; stroke-width: 1.25; }
    .leaf { fill: #faebd9; stroke: #a97345; stroke-width: 1.25; }
    .leaf-label { fill: #805026; }
  </style>

  <rect x="1" y="1" width="714" height="420" rx="14" fill="#fff" stroke="#d5e2e9" stroke-width="2"/>
  <text class="heading" x="24" y="37">主定理的递归树</text>
  <text class="column" x="23" y="72">深度</text>
  <text class="column" x="91" y="72">节点内标本地成本</text>
  <text class="column" x="533" y="72">整层成本</text>

  <rect x="18" y="85" width="680" height="53" rx="8" fill="#f0f6fa"/>
  <rect x="18" y="157" width="680" height="53" rx="8" fill="#f5f9fb"/>
  <rect x="18" y="229" width="680" height="53" rx="8" fill="#f0f6fa"/>
  <rect x="18" y="332" width="680" height="53" rx="8" fill="#fcf4e9"/>
  <path d="M510 85V385" stroke="#d6e3eb" stroke-width="1"/>

  <path class="edge" d="M286 112V147 M170 147H402 M170 147V184 M402 147V184"/>
  <path class="edge" d="M170 184V219 M110 219H230 M110 219V256 M230 219V256 M402 184V219 M342 219H462 M342 219V256 M462 219V256"/>

  <g aria-label="根">
    <text class="depth" x="40" y="118">0</text>
    <rect class="node" x="237" y="94" width="98" height="36" rx="9"/>
    <text class="math center" x="286" y="120">f(n)</text>
    <text class="math" x="533" y="120">f(n)</text>
  </g>

  <g aria-label="深度 1，共 a 个节点">
    <text class="depth" x="40" y="190">1</text>
    <rect class="node" x="120" y="166" width="100" height="36" rx="9"/>
    <rect class="node" x="352" y="166" width="100" height="36" rx="9"/>
    <text class="math center" x="170" y="192">f(n/b)</text>
    <text class="math center" x="286" y="191">…</text>
    <text class="math center" x="402" y="192">f(n/b)</text>
    <text class="math" x="533" y="192">a · f(n/b)</text>
  </g>

  <g aria-label="深度 2，共 a 的二次方个节点">
    <text class="depth" x="40" y="262">2</text>
    <rect class="node" x="67" y="238" width="86" height="36" rx="9"/>
    <rect class="node" x="187" y="238" width="86" height="36" rx="9"/>
    <rect class="node" x="299" y="238" width="86" height="36" rx="9"/>
    <rect class="node" x="419" y="238" width="86" height="36" rx="9"/>
    <text class="math center" x="110" y="264">f(n/b²)</text>
    <text class="math center" x="170" y="263">…</text>
    <text class="math center" x="230" y="264">f(n/b²)</text>
    <text class="math center" x="342" y="264">f(n/b²)</text>
    <text class="math center" x="402" y="263">…</text>
    <text class="math center" x="462" y="264">f(n/b²)</text>
    <text class="math" x="533" y="264">a² · f(n/b²)</text>
  </g>

  <path d="M110 282V328 M230 282V328 M342 282V328 M462 282V328" stroke="#9eb4c2" stroke-width="1.6" stroke-dasharray="2 5"/>
  <text class="math center" x="40" y="313">⋮</text>
  <text class="math center" x="286" y="313">⋮</text>
  <text class="math center" x="592" y="313">⋮</text>

  <g aria-label="叶子层，深度 L，共 a 的 L 次方个叶子">
    <text class="depth" x="40" y="365">L</text>
    <rect class="leaf" x="75" y="340" width="70" height="37" rx="6"/>
    <rect class="leaf" x="195" y="340" width="70" height="37" rx="6"/>
    <rect class="leaf" x="307" y="340" width="70" height="37" rx="6"/>
    <rect class="leaf" x="427" y="340" width="70" height="37" rx="6"/>
    <text class="math center leaf-label" x="110" y="366">Θ(1)</text>
    <text class="math center leaf-label" x="170" y="365">…</text>
    <text class="math center leaf-label" x="230" y="366">Θ(1)</text>
    <text class="math center leaf-label" x="342" y="366">Θ(1)</text>
    <text class="math center leaf-label" x="402" y="365">…</text>
    <text class="math center leaf-label" x="462" y="366">Θ(1)</text>
    <text class="math leaf-label" x="533" y="366">a<tspan font-size="15" baseline-shift="super">L</tspan> · Θ(1)</text>
  </g>

  <text class="depth" x="175" y="408">横向省略部分节点，纵向省略中间层</text>
  <text class="column" x="533" y="408">各层成本相加得 T(n)</text>
</svg>
